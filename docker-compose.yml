services:
  sandbox:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////data/sandbox.db"
      ID_SEED: "username-sandbox-seed"
      # MASTER_KEY: "set-me-to-protect-tenant-creation"
    volumes:
      - sandbox-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sandbox-data:
